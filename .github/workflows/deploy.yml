name: Build și deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Rezultatele noi ale rulării săptămânale a notebookurilor (verificare-laboratoare.yml) ajung pe site.
  workflow_run:
    workflows: [Verificarea laboratoarelor]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Verificare și build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Tot istoricul, pentru data „Ultima actualizare” a fiecărei pagini (lastUpdated în astro.config.mjs).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalare dependențe
        run: npm ci

      - name: Verificări (astro check, Biome, ortografie românească)
        run: npm run check

      # Rezultatele rulării automate a notebookurilor, afișate sub butonul Colab al fiecărui laborator
      # (src/utils/verificari.ts). Fără ramura `verificari`, paginile apar fără ele.
      - name: Rezultatele verificării laboratoarelor
        run: |
          if git fetch -q origin verificari; then
            mkdir -p src/data
            git show FETCH_HEAD:verificari.json > src/data/verificari.json
          else
            echo 'Ramura verificari nu există încă.'
          fi

      - name: Build (Astro + index Pagefind)
        run: npm run build

      - name: Încărcare artefact pentru GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy pe GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
